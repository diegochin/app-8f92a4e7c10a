<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flight Journal Archive</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --accent: #0284c7;
      --accent-highlight: #f59e0b;
      --badge-bg: #e0f2fe;
      --badge-text: #0369a1;
      --splitter-width: 8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text-main); height: 100vh; overflow: hidden; }
    
    #app { 
      display: flex; 
      height: 100vh; 
      width: 100vw; 
      position: relative;
      user-select: none;
    }
    
    #map-container { 
      width: 42%; 
      min-width: 250px; 
      max-width: calc(100vw - 320px); 
      height: 100%; 
      position: relative; 
      flex-shrink: 0;
    }
    #map { height: 100%; width: 100%; background: #e5e7eb; }
    
    #drag-splitter {
      width: var(--splitter-width);
      height: 100%;
      background: #e2e8f0;
      cursor: col-resize;
      position: relative;
      z-index: 1000;
      transition: background 0.15s ease;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #drag-splitter:hover, #drag-splitter.dragging { background: var(--accent); }
    #drag-splitter::after {
      content: "";
      width: 2px;
      height: 24px;
      background: #94a3b8;
      border-radius: 1px;
    }

    #sidebar { 
      flex: 1; 
      height: 100%; 
      overflow-y: auto; 
      padding: 1.5rem 2rem; 
      background: var(--bg); 
      scroll-behavior: smooth; 
      user-select: text;
      position: relative;
    }
    
    .map-toolbar { position: absolute; top: 12px; right: 12px; z-index: 1000; display: flex; gap: 8px; flex-wrap: wrap; }
    .map-btn {
      background: white;
      border: 1px solid var(--card-border);
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s ease;
    }
    .map-btn:hover { background: #f1f5f9; }
    .map-btn.active-mode { background: #fef3c7; border-color: #f59e0b; color: #b45309; }

    /* Clean Fixed Header */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
      padding-bottom: 0.85rem;
      border-bottom: 1px solid var(--card-border);
      gap: 1rem;
    }
    h1 { font-size: 1.55rem; color: var(--text-main); font-weight: 800; }

    .year-select-main {
      padding: 7px 14px;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--accent);
      background: #ffffff;
      border: 2px solid var(--accent);
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(2, 132, 199, 0.1);
      outline: none;
      transition: all 0.2s ease;
    }
    .year-select-main:hover { background: var(--badge-bg); }

    /* Floating Scroll-to-Top Button */
    #btn-scroll-top {
      position: fixed;
      bottom: 24px;
      right: 28px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      font-size: 1.2rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.35);
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.15s ease;
    }
    #btn-scroll-top.visible {
      opacity: 1;
      pointer-events: auto;
    }
    #btn-scroll-top:hover {
      transform: translateY(-2px);
      background: #0274b3;
    }

    /* Cards */
    .trip-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px; padding: 1.4rem; margin-bottom: 1.5rem; box-shadow: 0 2px 5px rgba(0,0,0,0.03); }
    .trip-title { font-size: 1.15rem; font-weight: 700; color: var(--text-main); margin-bottom: 0.75rem; }
    .flight-segment { margin-top: 1.1rem; padding-top: 0.85rem; border-top: 1px solid #f1f5f9; }
    
    .flight-badge { display: inline-block; background: var(--badge-bg); color: var(--badge-text); padding: 0.3rem 0.75rem; border-radius: 6px; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.5rem; cursor: pointer; transition: all 0.2s; }
    .flight-badge:hover, .flight-badge.active-flight { background: #fef3c7; color: #b45309; }

    .waypoint-block { margin-top: 0.85rem; padding: 0.75rem 0.9rem; background: #f8fafc; border-radius: 10px; border-left: 4px solid var(--accent); cursor: pointer; transition: all 0.2s; }
    .waypoint-block:hover { background: #f1f5f9; }
    .waypoint-block.active-waypoint { border-left-color: var(--accent-highlight); background: #fffbeb; }
    
    .waypoint-title { font-size: 0.95rem; font-weight: 600; color: var(--text-main); margin-bottom: 0.4rem; }
    
    /* Thumbnail Grid */
    .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 0.65rem; margin-top: 0.5rem; }
    .media-thumb-container { position: relative; width: 100%; height: 130px; border-radius: 8px; overflow: hidden; border: 1px solid var(--card-border); background: #0b1120; cursor: pointer; }
    .media-thumb { width: 100%; height: 100%; object-fit: cover; transition: transform 0.2s ease; }
    .media-thumb-container:hover .media-thumb { transform: scale(1.04); }
    
    .video-badge { position: absolute; bottom: 6px; right: 6px; background: rgba(15, 23, 42, 0.8); color: white; font-size: 0.7rem; font-weight: 700; padding: 2px 6px; border-radius: 4px; pointer-events: none; }
    
    .drag-marker-icon { background-color: #0284c7; border: 2px solid #ffffff; border-radius: 50%; box-shadow: 0 1px 4px rgba(0,0,0,0.3); cursor: pointer; transition: all 0.2s; }
    .drag-marker-icon.editable { cursor: grab; border-color: #f59e0b; outline: 2px dashed #f59e0b; }
    .drag-marker-icon.active-icon { background-color: #f59e0b; transform: scale(1.3); }

    .loc-marker-icon {
      background: #0284c7;
      color: white;
      border: 2px solid #ffffff;
      border-radius: 50%;
      font-weight: 800;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.35);
      cursor: pointer;
      transition: all 0.2s;
    }
    .loc-marker-icon.active-loc { background: #f59e0b; transform: scale(1.25); }

    /* Lightbox Modal */
    #lightbox { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.92); z-index: 9999; justify-content: center; align-items: center; }
    .lightbox-stage { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; }
    
    #lightbox-img, #lightbox-video { max-width: 88vw; max-height: 80vh; border-radius: 6px; box-shadow: 0 10px 35px rgba(0,0,0,0.6); object-fit: contain; }
    
    .lb-nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      border: 1px solid rgba(255,255,255,0.25);
      width: 50px;
      height: 60px;
      font-size: 2rem;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background 0.2s, transform 0.15s;
      user-select: none;
      z-index: 10001;
    }
    .lb-nav-btn:hover { background: rgba(255, 255, 255, 0.3); }
    #lb-prev { left: 24px; }
    #lb-next { right: 24px; }

    .lightbox-top-bar { position: absolute; top: 18px; right: 24px; display: flex; gap: 10px; z-index: 10001; }
    .lb-tool-btn {
      background: rgba(255, 255, 255, 0.18);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: background 0.2s;
    }
    .lb-tool-btn:hover { background: rgba(255, 255, 255, 0.35); }

    .lightbox-caption {
      margin-top: 14px;
      color: #f8fafc;
      font-size: 0.95rem;
      background: rgba(0, 0, 0, 0.65);
      padding: 7px 16px;
      border-radius: 20px;
      display: flex;
      gap: 12px;
      align-items: center;
      z-index: 10001;
    }

    #json-modal { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.88); z-index: 9999; justify-content: center; align-items: center; }
    .modal-box { background: white; padding: 1.5rem; border-radius: 12px; width: 80%; max-width: 700px; max-height: 85vh; display: flex; flex-direction: column; }
    .modal-box textarea { width: 100%; height: 50vh; font-family: monospace; font-size: 0.8rem; padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 6px; resize: vertical; }
    .modal-actions { margin-top: 1rem; display: flex; justify-content: flex-end; gap: 0.5rem; }

    @media(max-width: 850px) { 
      #app { flex-direction: column; } 
      #map-container { width: 100% !important; height: 35vh; max-width: none; } 
      #drag-splitter { display: none; }
      #sidebar { height: 65vh; width: 100%; padding: 1.25rem; } 
      #lb-prev { left: 8px; }
      #lb-next { right: 8px; }
    }
  </style>
</head>
<body>
<div id="app">
  <div id="map-container">
    <div class="map-toolbar">
      <button class="map-btn" onclick="resetViewAndHighlights()">🔍 Reset View</button>
      <button class="map-btn" id="btn-mode" onclick="toggleEditMode()">✏️ Edit Points: Off</button>
      <button class="map-btn" id="btn-json" onclick="openJsonEditor()">🛠 Edit / Save JSON</button>
    </div>
    <div id="map"></div>
  </div>
  
  <div id="drag-splitter" title="Drag to resize panels"></div>

  <div id="sidebar" onscroll="handleSidebarScroll(this)">
    <div class="header-bar">
      <h1 id="album-title">Locations</h1>
      <select class="year-select-main" id="select-year" onchange="changeYear(this.value)"></select>
    </div>
    <div id="journal-feed"></div>
    <button id="btn-scroll-top" onclick="scrollToTop()" title="Go to top">↑</button>
  </div>
</div>

<!-- Lightbox with Navigation & Fullscreen Controls -->
<div id="lightbox" onclick="closeLightbox(event)">
  <div class="lightbox-stage">
    <div class="lightbox-top-bar" onclick="event.stopPropagation()">
      <button class="lb-tool-btn" onclick="toggleFullscreen()">⛶ Fullscreen</button>
      <button class="lb-tool-btn" onclick="closeLightboxDirect()">✕ Close</button>
    </div>

    <button class="lb-nav-btn" id="lb-prev" onclick="navLightbox(-1, event)">‹</button>
    <button class="lb-nav-btn" id="lb-next" onclick="navLightbox(1, event)">›</button>

    <img id="lightbox-img" style="display:none;" src="" alt="Enlarged Media" ondblclick="toggleFullscreen()">
    <video id="lightbox-video" style="display:none;" controls autoplay playsinline></video>
    
    <div class="lightbox-caption" id="lightbox-caption" onclick="event.stopPropagation()">
      <span id="lb-filename"></span>
      <span id="lb-datetime" style="color: #38bdf8; font-weight: 600;"></span>
      <span id="lb-counter" style="color: #94a3b8; font-size: 0.85rem;"></span>
    </div>
  </div>
</div>

<!-- JSON Editor Modal -->
<div id="json-modal">
  <div class="modal-box">
    <h3 style="margin-bottom: 0.5rem;">Edit Album Structure</h3>
    <p style="font-size: 0.8rem; color: var(--text-sub); margin-bottom: 0.75rem;">Modify coordinates or media. Click "Download JS File" to save into your data folder.</p>
    <textarea id="json-editor-area"></textarea>
    <div class="modal-actions">
      <button class="map-btn" onclick="closeJsonEditor()">Cancel</button>
      <button class="map-btn" style="background: var(--accent); color: white;" onclick="applyJsonUpdates()">Apply & Render</button>
      <button class="map-btn" style="background: #10b981; color: white;" onclick="downloadUpdatedJs()">Download JS File</button>
    </div>
  </div>
</div>

<script>
  const AVAILABLE_YEARS = ["2016", "2017", "2018", "2019", "2020", "2021", "2022", "2023", "2023_part2", "2024", "2025", "2026"];
  const loadedYears = [];

  let currentYearKey = "";
  let activeYearData = [];
  let isEditMode = false;
  let routeLayers = {};
  let markerLayers = {};
  let allMarkersList = [];

  let currentGalleryList = [];
  let currentGalleryIndex = 0;

  const map = L.map('map').setView([47.0, 5.0], 4);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap &copy; CARTO',
    maxZoom: 19
  }).addTo(map);

  const routeGroup = L.featureGroup().addTo(map);
  const markerGroup = L.featureGroup().addTo(map);

  // Scroll to Top
  function handleSidebarScroll(el) {
    const btn = document.getElementById('btn-scroll-top');
    if (el.scrollTop > 200) {
      btn.classList.add('visible');
    } else {
      btn.classList.remove('visible');
    }
  }

  function scrollToTop() {
    document.getElementById('sidebar').scrollTo({ top: 0, behavior: 'smooth' });
  }

  // Splitter Resizing Logic
  const mapContainer = document.getElementById('map-container');
  const splitter = document.getElementById('drag-splitter');
  let isResizing = false;

  splitter.addEventListener('mousedown', (e) => {
    isResizing = true;
    splitter.classList.add('dragging');
    document.body.style.cursor = 'col-resize';
  });

  window.addEventListener('mousemove', (e) => {
    if (!isResizing) return;
    const newWidth = Math.max(250, Math.min(e.clientX, window.innerWidth - 320));
    mapContainer.style.width = newWidth + 'px';
    map.invalidateSize();
  });

  window.addEventListener('mouseup', () => {
    if (isResizing) {
      isResizing = false;
      splitter.classList.remove('dragging');
      document.body.style.cursor = 'default';
      map.invalidateSize();
    }
  });

  function isVideo(filename) { return /\.(mp4|mov|webm|m4v)$/i.test(filename); }

  function parseDateTime(filename) {
    const match = filename.match(/(20\d{2})(0[1-9]|1[0-2])(0[1-9]|[12]\d|3[01])[_-]([0-2]\d)([0-5]\d)([0-5]\d)/);
    if (match) {
      const year = match[1], month = match[2], day = match[3];
      const hour = match[4], min = match[5], sec = match[6];
      const d = new Date(`${year}-${month}-${day}T${hour}:${min}:${sec}`);
      return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) + ' • ' +
             d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }
    return '';
  }

  function getMediaUrl(filename, yearFallback) {
    if (filename.includes('/')) return filename;
    const folder = yearFallback || currentYearKey;
    return `${folder}/${filename}`;
  }

  function getYearSortValue(key) {
    if (key === "LOCATIONS") return -1;
    const match = key.match(/\d{4}/);
    return match ? parseInt(match[0], 10) : 0;
  }

  // Haversine Distance in Kilometers
  function getDistanceKm(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLon / 2) * Math.sin(dLon / 2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return R * c;
  }

  function loadYearScripts() {
    const selector = document.getElementById('select-year');
    selector.innerHTML = '';

    let loadCount = 0;
    AVAILABLE_YEARS.forEach(yKey => {
      const script = document.createElement('script');
      script.src = `data/data-${yKey}.js`;
      script.onload = () => {
        if (window["journalData_" + yKey]) {
          loadedYears.push(yKey);
        }
        checkReady();
      };
      script.onerror = () => checkReady();
      document.head.appendChild(script);
    });

    function checkReady() {
      loadCount++;
      if (loadCount === AVAILABLE_YEARS.length) {
        loadedYears.sort((a, b) => getYearSortValue(a) - getYearSortValue(b));

        const locOpt = document.createElement('option');
        locOpt.value = "LOCATIONS";
        locOpt.textContent = "Locations";
        selector.appendChild(locOpt);

        loadedYears.forEach(yKey => {
          const opt = document.createElement('option');
          opt.value = yKey;
          opt.textContent = yKey.replace('_part2', ' (Part 2)').replace('_', ' / ');
          selector.appendChild(opt);
        });

        if (loadedYears.length > 0) {
          selector.value = "LOCATIONS";
          changeYear("LOCATIONS");
        }
      }
    }
  }

  function changeYear(yearKey) {
    currentYearKey = yearKey;
    
    const btnMode = document.getElementById('btn-mode');
    const btnJson = document.getElementById('btn-json');
    if (yearKey === "LOCATIONS") {
      btnMode.style.display = 'none';
      btnJson.style.display = 'none';
      document.getElementById('album-title').textContent = "Locations";
      renderAllLocationsMode();
    } else {
      btnMode.style.display = 'inline-flex';
      btnJson.style.display = 'inline-flex';
      document.getElementById('album-title').textContent = yearKey.replace('_part2', ' (Part 2)').replace('_', ' / ');
      activeYearData = window["journalData_" + yearKey] || [];
      renderMapAndSidebar();
    }
  }

  // --- TRUE SPHERICAL DISTANCE CLUSTERING (<= 25km radius) ---
  function renderAllLocationsMode() {
    routeGroup.clearLayers();
    markerGroup.clearLayers();
    routeLayers = {};
    markerLayers = {};
    allMarkersList = [];

    const clusters = [];
    const CLUSTER_RADIUS_KM = 25; // 25 km clusters (Airports, bays, and city centroids group together)

    loadedYears.forEach(yKey => {
      const yearData = window["journalData_" + yKey] || [];
      yearData.forEach(trip => {
        trip.flights.forEach(flight => {
          flight.waypoints.forEach(wp => {
            if (!wp.coords || wp.coords.length !== 2) return;
            if (!wp.photos || wp.photos.length === 0) return; // Only cluster points with media

            const lat = wp.coords[0];
            const lon = wp.coords[1];

            // Find closest existing cluster within radius
            let matchedCluster = null;
            for (const cl of clusters) {
              const dist = getDistanceKm(cl.coords[0], cl.coords[1], lat, lon);
              if (dist <= CLUSTER_RADIUS_KM) {
                matchedCluster = cl;
                break;
              }
            }

            const visitData = {
              year: yKey,
              flightDate: flight.date,
              flightRoute: flight.route,
              tripTitle: trip.title,
              waypointName: wp.name,
              photos: wp.photos
            };

            if (matchedCluster) {
              matchedCluster.visits.push(visitData);
              // Pick the cleaner / more detailed name if available
              if (wp.name.length > matchedCluster.name.length && !wp.name.includes("On flight")) {
                matchedCluster.name = wp.name;
              }
            } else {
              clusters.push({
                id: `cluster-${clusters.length + 1}`,
                name: wp.name,
                coords: [lat, lon],
                visits: [visitData]
              });
            }
          });
        });
      });
    });

    const feed = document.getElementById('journal-feed');
    feed.innerHTML = `
      <p style="font-size: 0.9rem; color: var(--text-sub); margin-bottom: 1.5rem;">
        Showing all <b>${clusters.length}</b> unique geographic hubs visited across all flights. Click any location pin or list card to explore.
      </p>
    `;

    clusters.forEach(loc => {
      const totalPhotos = loc.visits.reduce((acc, v) => acc + v.photos.length, 0);

      const customIcon = L.divIcon({
        className: 'loc-marker-icon',
        html: `<span>${totalPhotos}</span>`,
        iconSize: [26, 26],
        iconAnchor: [13, 13]
      });

      const marker = L.marker(loc.coords, { icon: customIcon }).addTo(markerGroup);
      markerLayers[loc.id] = marker;

      marker.on('click', () => {
        highlightLocation(loc.id);
        scrollToElement(loc.id);
      });

      const card = document.createElement('div');
      card.className = 'trip-card';
      card.id = loc.id;
      card.style.cursor = 'pointer';

      let visitsHTML = '';
      loc.visits.forEach(visit => {
        const galleryJson = encodeURIComponent(JSON.stringify(visit.photos));
        const mediaHTML = `<div class="photo-grid">` + 
          visit.photos.map((p, idx) => {
            const path = getMediaUrl(p, visit.year);
            if (isVideo(p)) {
              return `
                <div class="media-thumb-container" onclick="openLightboxFromGallery('${galleryJson}', ${idx}, '${visit.year}')">
                  <video class="media-thumb" src="${path}#t=0.5" preload="metadata"></video>
                  <div class="video-badge">▶ VIDEO</div>
                </div>`;
            } else {
              return `
                <div class="media-thumb-container" onclick="openLightboxFromGallery('${galleryJson}', ${idx}, '${visit.year}')">
                  <img class="media-thumb" src="${path}" loading="lazy">
                </div>`;
            }
          }).join('') + 
        `</div>`;

        visitsHTML += `
          <div class="flight-segment" style="margin-top: 0.8rem; padding-top: 0.6rem;">
            <div class="flight-badge">
              ✈ ${visit.year.replace('_part2', ' (Part 2)').replace('_', ' / ')} • ${visit.flightDate ? visit.flightDate + ': ' : ''}${visit.flightRoute}
            </div>
            <div style="font-size: 0.85rem; font-weight: 600; color: var(--text-main); margin-bottom: 0.3rem;">
              📍 ${visit.waypointName}
            </div>
            ${mediaHTML}
          </div>
        `;
      });

      card.innerHTML = `
        <div style="display: flex; justify-content: space-between; align-items: center;" onclick="flyTo([${loc.coords}], 9); highlightLocation('${loc.id}');">
          <div class="trip-title" style="margin-bottom: 0;">📍 ${loc.name}</div>
          <span style="font-size: 0.8rem; font-weight: 700; color: var(--accent); background: var(--badge-bg); padding: 4px 10px; border-radius: 999px;">
            ${totalPhotos} ${totalPhotos === 1 ? 'item' : 'items'}
          </span>
        </div>
        ${visitsHTML}
      `;

      feed.appendChild(card);
    });

    if (markerGroup.getLayers().length > 0) {
      map.fitBounds(markerGroup.getBounds().pad(0.1));
    }
  }

  function highlightLocation(locId) {
    Object.values(markerLayers).forEach(m => {
      if (m.getElement()) m.getElement().classList.remove('active-loc');
    });
    if (markerLayers[locId] && markerLayers[locId].getElement()) {
      markerLayers[locId].getElement().classList.add('active-loc');
    }
    document.querySelectorAll('.trip-card').forEach(c => c.style.borderColor = 'var(--card-border)');
    const cardEl = document.getElementById(locId);
    if (cardEl) {
      cardEl.style.borderColor = 'var(--accent-highlight)';
    }
  }

  // --- SINGLE YEAR MODE ---
  function buildFlightRoute(flight) {
    const rawStops = [flight.origin.coords, ...flight.waypoints.map(w => w.coords), flight.destination.coords];
    const stops = [];
    rawStops.forEach((pt) => {
      if (stops.length === 0) {
        stops.push(pt);
      } else {
        const prev = stops[stops.length - 1];
        const dist = Math.hypot(pt[0] - prev[0], pt[1] - prev[1]);
        if (dist > 0.0001) stops.push(pt);
      }
    });

    const features = [];
    for (let i = 0; i < stops.length - 1; i++) {
      try {
        const p1 = turf.point([stops[i][1], stops[i][0]]);
        const p2 = turf.point([stops[i+1][1], stops[i+1][0]]);
        const arc = turf.greatCircle(p1, p2, { npoints: 40 });
        features.push(arc);
      } catch (err) {
        features.push(turf.lineString([[stops[i][1], stops[i][0]], [stops[i+1][1], stops[i+1][0]]]));
      }
    }
    return turf.featureCollection(features);
  }

  function renderMapAndSidebar() {
    routeGroup.clearLayers();
    markerGroup.clearLayers();
    routeLayers = {};
    markerLayers = {};
    allMarkersList = [];

    activeYearData.forEach(trip => {
      trip.flights.forEach(flight => {
        const geoJsonData = buildFlightRoute(flight);
        const polyline = L.geoJSON(geoJsonData, {
          style: { color: '#0284c7', weight: 2.5, dashArray: '5, 5', opacity: 0.7 }
        }).addTo(routeGroup);

        polyline.on('click', () => { selectFlight(flight.id); scrollToElement(flight.id); });
        routeLayers[flight.id] = polyline;

        flight.waypoints.forEach(wp => {
          const customIcon = L.divIcon({ className: 'drag-marker-icon' + (isEditMode ? ' editable' : ''), iconSize: [12, 12], iconAnchor: [6, 6] });
          const marker = L.marker(wp.coords, { icon: customIcon, draggable: isEditMode }).addTo(markerGroup);
          markerLayers[wp.id] = marker;
          allMarkersList.push(marker);

          marker.on('click', () => { selectWaypoint(wp.id, flight.id); scrollToElement(wp.id); });
          marker.on('dragend', function (e) {
            const latlng = e.target.getLatLng();
            const newCoords = [parseFloat(latlng.lat.toFixed(6)), parseFloat(latlng.lng.toFixed(6))];
            wp.coords = newCoords;
            const updatedGeoJSON = buildFlightRoute(flight);
            routeLayers[flight.id].clearLayers();
            routeLayers[flight.id].addData(updatedGeoJSON);
          });
        });
      });
    });

    if (routeGroup.getLayers().length > 0) { map.fitBounds(routeGroup.getBounds().pad(0.1)); }

    const feed = document.getElementById('journal-feed');
    feed.innerHTML = '';
    activeYearData.forEach(trip => {
      const card = document.createElement('div');
      card.className = 'trip-card';
      let flightsHTML = '';
      trip.flights.forEach(f => {
        let waypointsHTML = '';
        f.waypoints.forEach(wp => {
          let mediaHTML = '';
          if (wp.photos && wp.photos.length > 0) {
            const galleryJson = encodeURIComponent(JSON.stringify(wp.photos));
            mediaHTML = `<div class="photo-grid">` + 
              wp.photos.map((p, idx) => {
                const path = getMediaUrl(p);
                if (isVideo(p)) {
                  return `
                    <div class="media-thumb-container" onclick="openLightboxFromGallery('${galleryJson}', ${idx})">
                      <video class="media-thumb" src="${path}#t=0.5" preload="metadata"></video>
                      <div class="video-badge">▶ VIDEO</div>
                    </div>`;
                } else {
                  return `
                    <div class="media-thumb-container" onclick="openLightboxFromGallery('${galleryJson}', ${idx})">
                      <img class="media-thumb" src="${path}" loading="lazy">
                    </div>`;
                }
              }).join('') + 
            `</div>`;
          }
          waypointsHTML += `
            <div class="waypoint-block" id="${wp.id}" onclick="selectWaypoint('${wp.id}', '${f.id}'); flyTo([${wp.coords}], 8);">
              <div class="waypoint-title">📍 ${wp.name}</div>
              ${mediaHTML}
            </div>
          `;
        });

        flightsHTML += `
          <div class="flight-segment" id="${f.id}">
            <div class="flight-badge" onclick="selectFlight('${f.id}'); flyToBounds([${f.origin.coords}], [${f.destination.coords}]);">
              ✈ ${f.date ? f.date + ': ' : ''}${f.route}
            </div>
            ${f.note ? `<div style="font-size: 0.8rem; color: var(--text-sub); margin-bottom: 0.4rem;">${f.note}</div>` : ''}
            ${waypointsHTML}
          </div>
        `;
      });
      card.innerHTML = `<div class="trip-title">${trip.title}</div>${flightsHTML}`;
      feed.appendChild(card);
    });
  }

  function toggleEditMode() {
    if (currentYearKey === "LOCATIONS") return;
    isEditMode = !isEditMode;
    const btn = document.getElementById('btn-mode');
    if (isEditMode) {
      btn.textContent = "✏️ Edit Points: ON";
      btn.classList.add('active-mode');
    } else {
      btn.textContent = "✏️ Edit Points: Off";
      btn.classList.remove('active-mode');
    }
    allMarkersList.forEach(m => {
      if (isEditMode) {
        m.dragging.enable();
        if (m.getElement()) m.getElement().classList.add('editable');
      } else {
        m.dragging.disable();
        if (m.getElement()) m.getElement().classList.remove('editable');
      }
    });
  }

  function resetViewAndHighlights() {
    resetHighlights();
    mapContainer.style.width = '42%';
    map.invalidateSize();

    if (currentYearKey === "LOCATIONS") {
      if (markerGroup.getLayers().length > 0) {
        map.flyToBounds(markerGroup.getBounds().pad(0.1), { animate: true, duration: 1.2 });
      }
    } else {
      if (routeGroup.getLayers().length > 0) {
        map.flyToBounds(routeGroup.getBounds().pad(0.1), { animate: true, duration: 1.2 });
      }
    }
  }

  function resetHighlights() {
    Object.values(routeLayers).forEach(layer => {
      layer.setStyle({ color: '#0284c7', weight: 2.5, dashArray: '5, 5', opacity: 0.7 });
    });
    Object.values(markerLayers).forEach(m => {
      const el = m.getElement();
      if (el) {
        el.classList.remove('active-icon');
        el.classList.remove('active-loc');
      }
    });
    document.querySelectorAll('.flight-badge').forEach(b => b.classList.remove('active-flight'));
    document.querySelectorAll('.waypoint-block').forEach(w => w.classList.remove('active-waypoint'));
    document.querySelectorAll('.trip-card').forEach(c => c.style.borderColor = 'var(--card-border)');
  }

  function selectFlight(flightId) {
    resetHighlights();
    if (routeLayers[flightId]) {
      routeLayers[flightId].setStyle({ color: '#f59e0b', weight: 4, dashArray: null, opacity: 1 });
      routeLayers[flightId].bringToFront();
    }
    const flightEl = document.getElementById(flightId);
    if (flightEl) {
      const badge = flightEl.querySelector('.flight-badge');
      if (badge) badge.classList.add('active-flight');
    }
  }

  function selectWaypoint(wpId, flightId) {
    selectFlight(flightId);
    if (markerLayers[wpId]) {
      const el = markerLayers[wpId].getElement();
      if (el) el.classList.add('active-icon');
    }
    const wpEl = document.getElementById(wpId);
    if (wpEl) wpEl.classList.add('active-waypoint');
  }

  function scrollToElement(id) {
    const el = document.getElementById(id);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function flyTo(coords, zoom) { map.flyTo(coords, zoom, { animate: true, duration: 1.2 }); }
  function flyToBounds(c1, c2) { map.flyToBounds(L.latLngBounds([c1, c2]), { padding: [50, 50], animate: true, duration: 1.2 }); }

  let activeGalleryYear = null;
  function openLightboxFromGallery(galleryJsonEncoded, index, yearOverride) {
    currentGalleryList = JSON.parse(decodeURIComponent(galleryJsonEncoded));
    currentGalleryIndex = index;
    activeGalleryYear = yearOverride || null;
    displayLightboxCurrent();
    document.getElementById('lightbox').style.display = 'flex';
  }

  function displayLightboxCurrent() {
    if (!currentGalleryList || currentGalleryList.length === 0) return;
    
    const filename = currentGalleryList[currentGalleryIndex];
    const isVid = isVideo(filename);
    const path = getMediaUrl(filename, activeGalleryYear);
    const img = document.getElementById('lightbox-img');
    const vid = document.getElementById('lightbox-video');

    document.getElementById('lb-filename').textContent = filename;
    document.getElementById('lb-datetime').textContent = parseDateTime(filename);
    document.getElementById('lb-counter').textContent = `(${currentGalleryIndex + 1} / ${currentGalleryList.length})`;

    document.getElementById('lb-prev').style.display = currentGalleryList.length > 1 ? 'flex' : 'none';
    document.getElementById('lb-next').style.display = currentGalleryList.length > 1 ? 'flex' : 'none';

    if (isVid) {
      img.style.display = 'none'; img.src = '';
      vid.style.display = 'block'; vid.src = path; vid.play();
    } else {
      vid.style.display = 'none'; vid.pause(); vid.src = '';
      img.style.display = 'block'; img.src = path;
    }
  }

  function navLightbox(direction, event) {
    if (event) event.stopPropagation();
    currentGalleryIndex = (currentGalleryIndex + direction + currentGalleryList.length) % currentGalleryList.length;
    displayLightboxCurrent();
  }

  function toggleFullscreen() {
    const stage = document.querySelector('.lightbox-stage');
    if (!document.fullscreenElement) {
      if (stage.requestFullscreen) stage.requestFullscreen();
      else if (stage.webkitRequestFullscreen) stage.webkitRequestFullscreen();
    } else {
      if (document.exitFullscreen) document.exitFullscreen();
    }
  }

  function closeLightbox(event) {
    if (event.target.id === 'lightbox' || event.target.className === 'lightbox-stage') {
      closeLightboxDirect();
    }
  }

  function closeLightboxDirect() {
    const lb = document.getElementById('lightbox');
    const vid = document.getElementById('lightbox-video');
    vid.pause();
    vid.src = '';
    lb.style.display = 'none';
    if (document.fullscreenElement) {
      document.exitFullscreen();
    }
  }

  window.addEventListener('keydown', (e) => {
    const lb = document.getElementById('lightbox');
    if (lb.style.display === 'flex') {
      if (e.key === 'ArrowLeft') navLightbox(-1);
      else if (e.key === 'ArrowRight') navLightbox(1);
      else if (e.key === 'Escape') closeLightboxDirect();
    }
  });

  function openJsonEditor() {
    if (currentYearKey === "LOCATIONS") return;
    document.getElementById('json-editor-area').value = JSON.stringify(activeYearData, null, 2);
    document.getElementById('json-modal').style.display = 'flex';
  }

  function closeJsonEditor() { document.getElementById('json-modal').style.display = 'none'; }

  function applyJsonUpdates() {
    try {
      activeYearData = JSON.parse(document.getElementById('json-editor-area').value);
      window["journalData_" + currentYearKey] = activeYearData;
      renderMapAndSidebar();
      closeJsonEditor();
    } catch (e) {
      alert("Invalid JSON format. Check console for details.");
    }
  }

  function downloadUpdatedJs() {
    const fileContent = `window.journalData_${currentYearKey} = ${JSON.stringify(activeYearData, null, 2)};\n`;
    const blob = new Blob([fileContent], { type: "text/javascript" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `data-${currentYearKey}.js`;
    link.click();
  }

  window.addEventListener('DOMContentLoaded', loadYearScripts);
</script>
</body>
